<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموجز اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --surface:#fffffe; --ink:#1a1a18; --muted:#6b6b63;
    --line:#e2e0d9; --accent:#8a1c1c; --accent-soft:#f2e6e6;
    --src:#5a6b7a; --src-bg:#eef1f4; --warn:#8a5a1c; --warn-bg:#f7efe2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14140f; --surface:#1c1c18; --ink:#eceae2; --muted:#9a978c;
      --line:#2e2e28; --accent:#e0736b; --accent-soft:#2c1c1a;
      --src:#9fb4c4; --src-bg:#22282e; --warn:#d9a545; --warn-bg:#2a2318;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
    line-height:1.85; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 72px}
  header.masthead{
    border-bottom:3px double var(--line); padding-bottom:18px; margin-bottom:26px; text-align:center;
  }
  .masthead h1{
    margin:0 0 6px; font-size:clamp(28px,7vw,42px); font-weight:700;
    letter-spacing:-.5px; color:var(--accent);
  }
  .masthead .sub{color:var(--muted);font-size:14px;margin:0}
  .updated{
    display:inline-block;margin-top:12px;font-size:12.5px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;
  }
  .entry{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:22px 20px; margin-bottom:26px;
  }
  .entry > h1{
    font-size:19px;margin:0 0 18px;padding-bottom:12px;
    border-bottom:1px solid var(--line);font-weight:700;
  }
  .entry h2{
    font-size:15px;font-weight:600;color:var(--accent);
    margin:22px 0 10px;display:flex;align-items:center;gap:8px;
  }
  .entry h2::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
  }
  .entry h2:first-of-type{margin-top:0}
  .entry ul{list-style:none;margin:0;padding:0}
  .entry li{
    padding:11px 14px;margin-bottom:8px;border-radius:9px;
    background:var(--bg);border-right:3px solid var(--line);font-size:15px;
  }
  .entry li:hover{border-right-color:var(--accent)}
  .d{font-weight:600;color:var(--accent);white-space:nowrap}
  .src{
    display:inline-block;font-size:12px;color:var(--src);background:var(--src-bg);
    padding:2px 9px;border-radius:6px;margin-inline-start:6px;white-space:nowrap;
  }
  .src.one{color:var(--warn);background:var(--warn-bg)}
  .note{
    font-size:13px;color:var(--muted);background:var(--warn-bg);
    border-radius:8px;padding:11px 14px;margin-top:18px;line-height:1.7;
  }
  @media (prefers-color-scheme: dark){.note{background:#241f16}}
  .entry hr{display:none}
  .status{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px}
  footer code{background:var(--surface);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>الموجز اليومي</h1>
    <p class="sub">أخبار الخليج والشرق الأوسط والاقتصاد — آخر 24 ساعة</p>
    <div class="updated" id="updated">جارٍ التحميل…</div>
  </header>
  <main id="content"><div class="status">جارٍ تحميل الموجز…</div></main>
  <footer>يُحدَّث تلقائيًا كل يوم الساعة 08:00 بتوقيت الرياض · المصدر <code>news-brief.md</code></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var content = document.getElementById('content');
  var updated = document.getElementById('updated');

  function decorate(root){
    root.querySelectorAll('li').forEach(function(li){
      var html = li.innerHTML;
      // Trailing parenthetical = sources
      html = html.replace(/\(([^()]*)\)\s*$/, function(_, inner){
        var one = /مصدر واحد|إعلان طرف/.test(inner);
        return '<span class="src' + (one ? ' one' : '') + '">' + inner + '</span>';
      });
      // Leading "weekday DD month —" = date stamp
      html = html.replace(/^([^—]{4,40}?)\s*—\s*/, '<span class="d">$1</span> — ');
      li.innerHTML = html;
    });
    // Standalone note paragraphs
    root.querySelectorAll('p').forEach(function(p){
      if (/^\s*ملاحظة/.test(p.textContent)) p.className = 'note';
    });
  }

  fetch('./news-brief.md?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(md){
      // Split the archive on horizontal rules into separate day entries
      var parts = md.split(/\n-{3,}\n/).filter(function(s){ return s.trim(); });
      content.innerHTML = '';
      parts.forEach(function(part){
        var div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = marked.parse(part.trim());
        decorate(div);
        content.appendChild(div);
      });
      var first = content.querySelector('.entry h1');
      updated.textContent = first ? 'آخر تحديث: ' + first.textContent.replace(/^.*?—\s*/, '')
                                  : 'آخر تحديث غير معروف';
    })
    .catch(function(e){
      content.innerHTML = '<div class="status">تعذّر تحميل الموجز (' + e.message + ')</div>';
      updated.textContent = 'غير متاح';
    });
})();
</script>
</body>
</html>
